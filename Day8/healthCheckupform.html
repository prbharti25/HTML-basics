<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Details Form</title>
    <style>
    .a
    {
        background-color: green;
        color: white;
    }
    #b
    {
        background-color:cadetblue;
        color: white;
    }
    </style>
</head>
<body>
    <form action="">
        <header>
            <h1>Health Details Form</h1>
        </header>

        <fieldset>
            <legend class="a">Personal Information</legend>

            <label for="name">Full Name: </label>
            <input type="text" id="name" name="Name" placeholder="Enter your full name">
            <br><br>

            <label for="birth">Date of Birth: </label>
            <input type="date" id="birth" name="DOB">
            <br><br>

            <label for="sex">Gender: </label>
            <select name="Gender" id="sex">
                <option value="" disabled selected>Select your gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Others">Others</option>
            </select>
            <br><br>

            <label for="phone">Phone Number: </label>
            <input type="tel" id="phone" name="Contact" placeholder="Enter your phone number">
        </fieldset><br>

        <fieldset>
            <legend class="a">Medical History</legend>

            <label for="blood">Blood Group: </label>
            <select name="Blood Type" id="blood">
                <option value=""disabled selected>Select your blood type</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
            <br><br>

            <label name="Glasses or Contact">Do you wear glasses or contact lenses?</label><br>
            <input type="radio" name="Glasses or Contact" id="yes" value="Yes"> 
            <label for="yes" >Yes</label><br>
            <input type="radio" name="Glasses or Contact" id="no" value="No"> 
            <label for="no">No</label><br><br>

            <label for="conditions">Pre-Existing Conditions: </label><br>
            <textarea name="Medical Condition" id="conditions" placeholder="List any pre-existing medical conditions" rows="4" cols="30"></textarea>
            <br><br>

            <label for="">Allergies: </label><br>
            <input type="checkbox" id="a" value="Polen"> <label for="a">Polen</label><br>
            <input type="checkbox" id="b" value="Peanut"> <label for="b">Peanut</label><br>
            <input type="checkbox" id="c" value="Latex"> <label for="c">Latex</label><br>
            <input type="checkbox" id="d" value="None"> <label for="d">None</label>
            <br><br>

            <label for="current">Current Medications: </label><br>
            <textarea name="Current Medications" id="current" placeholder="List any current medicatons" rows=4 cols="30"></textarea>
        </fieldset><br>

        <fieldset>
            <legend class="a">Emergency Contact</legend>

            <label for="Ename">Emergency Contact Name: </label>
            <input type="text" id="Ename" name="Emergency Contact Name">
            <br><br>
            
            <label for="contact">Emergency Contact Number: </label>
            <input type="tel" id="contact" name="Emergency Contact Number">
            <br><br>

            <label for="relation">Relationship to Emergency Contact: </label>
            <input type="text" id="relation" name="Relationship">

        </fieldset><br>

        <input type="checkbox" id="tick" required>
        <label for="tick">All the informations provided by me above is true to the best my knowledge*.</label>
        <br><br>

        <button id="b">Submit</button>
    </form>

</body>
</html>
