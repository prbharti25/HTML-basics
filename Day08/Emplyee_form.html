<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee's Details</title>
</head>
<body>
    <form>
        <fieldset>
            <h1>Employee's Details Form</h1>
            <label for="name">Full Name: </label>
            <input type="text" id="name" name="fname" placeholder="Enter your full name ">
            <br><br>

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" placeholder="Enter your email address">
            <br><br>

            <label for="phone">Phone Number: </label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
            <br><br>

            <label>Gender: </label>
            <label for="male">Male: </label>
            <input type="radio" id="male" name="Gender" value="Male">
            <label for="female">Female: </label>
            <input type="radio" id="female" name="Gender" value="Female">
            <label for="others">Others: </label>
            <input type="radio" id="others" name="Gender" value="Others">
            <br><br>

            <label for="job">Job Title: </label>
            <input type="text" id="job" name="job" placeholder="Enter your job title">
            <br><br>

            <label for="dep">Department: </label>
            <select name="Department" id="dep">
                <option value="" disabled selected>Select your Department</option>
                <option value="Engineer">Engineer</option>
                <option value="Doctor">Doctor</option>
                <option value="IT">IT</option>
                <option value="Finance">Finance</option>
            </select>
            <br><br>

            <button>Submit</button>
        </fieldset>
    </form>
</body>
</html>
