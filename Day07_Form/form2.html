<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>User Registration</h1>
    
    <label for="emailId">Email: </label>
    <input type="email" id="emailId" name="email" placeholder="Enter your e-mail"><br><br>
    
    <label for="pass">Password: </label>
    <input type="password" id="pass" name="pass" placeholder="Type your password"><br><br>
    
    <label>Gender: </label>

    <label for="m">Male</label>
    <input type="radio" name="gender" value="male" id="m">

    <label for="f">Female</label>
    <input type="radio" name="gender" value="female" id="f">
    
    <label for="o">Others </label>
    <input type="radio" name="gender" value="others" id="o"><br><br>

    <input type="checkbox" id="term" name="conditions" required>
    <label for="term">I agree the the terms and conditions</label><br><br>

    <button>Register</button>

</body>
</html>
