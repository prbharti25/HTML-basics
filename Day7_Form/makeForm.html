<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contact Us</h1>
<label for="name">Full Name: </label>
<input type="text" id="name" name="fname" placeholder="Enter your name"><br><br>

<label for="email">Email:</label>
<input type="text" id="email" name="emailId" placeholder="Xyz1234@gmail.com"><br><br>

<label for="password">Password</label>
<input type="password" id="password" name="passWord" placeholder="Privacy password"><br><br>

<label for="mobile">Phone Number:</label>
<input type="tel" id="mobile" name="Phone" placeholder="Your Contact Number"><br><br>

<label for="message">Message:</label>
<textarea name="msg" rows="5" cols="25" id="message" placeholder="Type your message here"></textarea><br><br>

<button>Send</button>

</body>
</html>
